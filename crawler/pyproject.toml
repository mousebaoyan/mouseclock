[project]
name = "crawler"
version = "0.1.0"
description = "鼠钟的抓取节点：抓取、初筛和抽取"
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28",
    "pydantic>=2.14.1",
]

[dependency-groups]
dev = [
    "datamodel-code-generator>=0.86.0",
    "pyright>=1.1.400",
    "pytest>=9.1",
    "ruff>=0.17",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14"]
build-backend = "uv_build"

[tool.uv]
# An older uv may write the lockfile differently.
required-version = ">=0.13"
# Only install versions published at least a day ago, to skip freshly poisoned releases.
exclude-newer = "1 day"

[tool.ruff]
line-length = 100
# Generated from the website's OpenAPI document; the generator formats it.
extend-exclude = ["src/crawler/crawl/contract.py"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "BLE", "C4", "PIE", "PT", "RET", "SIM", "PTH", "PERF",
    "ASYNC", "RUF",
]

[tool.pyright]
typeCheckingMode = "strict"

[tool.pytest]
python_files = ["*_test.py"]
testpaths = ["src"]

# The website's API for the crawler (docs/api.md §6), generated from the OpenAPI document the
# website writes. `uv run datamodel-codegen` regenerates it; check.sh fails when it is stale.
[tool.datamodel-codegen]
input = "../web/openapi/crawler.json"
input-file-type = "openapi"
output = "src/crawler/crawl/contract.py"
output-model-type = "pydantic_v2.BaseModel"
target-python-version = "3.14"
use-annotated = true
field-constraints = true
enum-field-as-literal = "all"
use-double-quotes = true
disable-timestamp = true
formatters = ["ruff-format"]
type-mappings = ["uri=string"]
use-type-alias = true
