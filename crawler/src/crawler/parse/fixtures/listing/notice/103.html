    <h2>自编学院甲 2027 年直博生预报名</h2>
    <p>本地验证大学自编学院甲面向预计取得推荐免试资格的 2027 届本科毕业生开展直接攻读博士学位研究生预报名，招生专业为人工智能。</p>
    <p>报名时间为北京时间 2026 年 9 月 8 日 09:00 至 2026 年 9 月 18 日 17:00。</p>
    <p>申请材料包括个人简历、本科成绩单和研究计划。本示例不提供真实报名入口，也不收集任何材料。</p>
    <p>考核时间为北京时间 2026 年 9 月 21 日 09:00，考核形式为线上面试。</p>
