    <p>发布日期：<time datetime="2026-09-09">2026-09-09</time></p>
    <p>本通知完全虚构，仅用于本地验证，不接受真实报名。</p>
    <h2>自编学院乙 2027 年推荐免试研究生预报名</h2>
    <p>本地验证大学自编学院乙面向预计取得推荐免试资格的 2027 届本科毕业生开展预报名，招生专业为软件工程，培养层次为硕士。</p>
    <p>报名时间为北京时间 2026 年 9 月 9 日 09:00 至 2026 年 9 月 19 日 18:00。</p>
    <p>申请材料包括个人简历、本科成绩单和研究兴趣说明。本示例不提供真实报名入口，也不收集任何材料。</p>
    <p>考核时间为北京时间 2026 年 9 月 22 日 14:00，考核形式为线上面试。</p>
