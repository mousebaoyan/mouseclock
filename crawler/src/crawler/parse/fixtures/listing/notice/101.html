    <p>本地验证大学自编学院甲面向预计取得推荐免试资格的 2027 届本科毕业生开展预报名，招生专业为计算机科学与技术，培养层次为硕士。</p>

    <p>考核时间为北京时间 2026 年 9 月 23 日 09:00，考核形式为线上面试。</p>
