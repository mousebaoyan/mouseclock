# The 鼠钟 site in 1Panel's OpenResty; see docs/design.md §16. It is a 1Panel reverse-proxy site for
# clock.mousebaoyan.cn, with 1Panel's HTTPS settings doing the certificate and HTTP3.
#
# This file replaces the site's proxy/root.conf, which 1Panel includes in the server block. No
# add_header here: it would drop the Alt-Svc header 1Panel adds for HTTP3.
#
# The zones go in the http block, as /opt/1panel/www/conf.d/00-mouseclock-limit.conf:
#   limit_req_zone $binary_remote_addr zone=mouseclock_req:10m rate=30r/s;
#   limit_conn_zone $binary_remote_addr zone=mouseclock_conn:10m;
# Loose on purpose: a campus network can put a whole dormitory behind one address.

# The site compresses its own responses.
gzip off;
# The crawler sends attachments of up to 50 MB.
client_max_body_size 50m;
limit_conn mouseclock_conn 100;

location / {
    limit_req zone=mouseclock_req burst=120 nodelay;
    proxy_pass http://127.0.0.1:3280;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Connection "";
}
