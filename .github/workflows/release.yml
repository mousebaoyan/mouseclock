name: Release

# A version tag on main builds the website's and the crawler's images and pushes them to GHCR,
# where the two machines pull them from (docs/design.md §16).
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        part: [web, crawler]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/mousebaoyan/mouseclock-${{ matrix.part }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.part }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Layers whose inputs didn't change are the last release's, which the machines already
          # have. Kept in GHCR: the Actions cache of one tag can't be read by the next.
          cache-from: type=registry,ref=ghcr.io/mousebaoyan/mouseclock-${{ matrix.part }}:buildcache
          cache-to: type=registry,ref=ghcr.io/mousebaoyan/mouseclock-${{ matrix.part }}:buildcache,mode=max,image-manifest=true,oci-mediatypes=true
