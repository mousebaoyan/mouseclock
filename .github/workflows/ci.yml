name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: mouseclock
          POSTGRES_PASSWORD: mouseclock
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-retries 30
    env:
      DATABASE_URL: postgres://mouseclock:mouseclock@localhost:5432/mouseclock
      PUBLIC_URL: http://localhost:5173
      MOUSEHOLE_URL: http://localhost:5173/fake-mousehole
      MOUSEHOLE_CLIENT_ID: mouseclock-dev
      MOUSEHOLE_CLIENT_SECRET: dev-secret-not-for-production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          # 26.13.0 is listed on nodejs.org without its SHASUMS256.txt, so pnpm can't verify it.
          runtime: node@26.12.1
          working-directory: web
          cache: true
          require-lockfile: true
      - run: pnpm check
      - run: pnpm db:migrate
      # Seeding goes through the ingest services, so this catches it falling behind them.
      - run: pnpm seed
      - run: pnpm db:codegen --verify
      # The crawler's API types come from this file; the crawler job checks they match it.
      - run: pnpm openapi && git diff --exit-code -- openapi
      - run: pnpm build

  crawler:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          working-directory: crawler
      - run: crawler/check.sh
