name: 任务
description: 认领总体设计 §17 里的一项功能，或者一件具体的工作
title: "[任务] "
labels: [task]
body:
  - type: textarea
    id: context
    attributes:
      label: 关联与状态
      description: 做总体设计 §17 里的哪一项，或者要解决的具体问题；相关的 Issue 和 PR。进展有变化时更新这里
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: 目标
      description: 做完以后，用户或开发者能得到什么
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 范围
      description: 要做的和不做的，涉及的设计文档章节
    validations:
      required: true
  - type: textarea
    id: plan
    attributes:
      label: 打算怎么做
      description: 大致的做法，以及设计里没写到、要和维护者商量的地方
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 验收标准
      description: 怎样才算做完：主要的用法、最要紧的异常情况，以及有接头时怎么单独演示；关闭 Issue 前逐条核对
    validations:
      required: true
